<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#23282a" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Rulmaksan Teklif</title>
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .ust-menu { display: flex; gap: 6px; justify-content: center; padding: 8px 12px 0; flex-wrap: wrap; }
    .ust-menu a { padding: 8px 14px; border-radius: 999px; color: inherit; text-decoration: none; opacity: 0.75; }
    .ust-menu a.active { background: var(--yesil, #3a9a48); color: #fff; opacity: 1; }
    @media print { .topbar, .ust-menu { display: none !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-ic">
      <img class="logo" src="icons/logo.jpg" alt="Rulmaksan" width="34" height="40">
      <h1 id="baslik">Rulmaksan <span>Teklif</span></h1>
    </div>
  </header>
  <nav class="ust-menu">
    <a href="#teklif" data-tab="teklif">Yeni teklif</a>
    <a href="#teklif/liste" data-tab="liste">Kayıtlı teklifler</a>
    <a href="#veriler" data-tab="veriler">Veriler</a>
  </nav>
  <main id="view"></main>
  <div id="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
